{{define "content"}}
    <h1 class="h4 mt-2">Cases cited by <a href="{{.Edition.URL}}">{{.Edition.Title}}</a></h1>
    <p class="small text-secondary">
        Every case this edition's linked citations reach, with how many citations reach it.
        Click <em>pages</em> for the citations themselves.
    </p>
    <div class="btn-group btn-group-sm mb-3" role="group" aria-label="Sort">
        <a href="{{.Edition.AllCasesURL}}?sort=cites" class="btn {{if eq .Sort "cites"}}btn-primary{{else}}btn-outline-secondary{{end}}">Most cited</a>
        <a href="{{.Edition.AllCasesURL}}?sort=year" class="btn {{if eq .Sort "year"}}btn-primary{{else}}btn-outline-secondary{{end}}">Oldest case</a>
        <a href="{{.Edition.AllCasesURL}}?sort=name" class="btn {{if eq .Sort "name"}}btn-primary{{else}}btn-outline-secondary{{end}}">Name</a>
    </div>
    {{template "top_cases" .Cases}}
    {{template "pagination" .Nav}}
{{end}}
